name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build
        run: make CC=${{ matrix.cc }}

      - name: Test
        run: make CC=${{ matrix.cc }} test

      - name: Report version
        run: ./build/masa version

  windows-cross:
    name: windows cross-compile (mingw-w64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cross-compile for Windows
        run: |
          set -e
          mkdir -p build/win
          for f in src/main.c src/cc_wrapper.c src/sys_shims.c src/tool_shims.c \
                   src/sdk.c src/xcodeproj.c src/brew.c src/exec.c \
                   src/platform_win.c; do
            x86_64-w64-mingw32-gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
              -c "$f" -o "build/win/$(basename "$f" .c).o"
          done
          x86_64-w64-mingw32-gcc -Iinclude build/win/*.o -o build/win/masa.exe
          ls -l build/win/masa.exe
